[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "studio — the cyberlink composer: link two particles, move a box, set a valence, sign the signal"
license-file = "../LICENSE"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# the real stack: a particle is a hemera hash, the neuron is a mudra
# domain-scoped key, a signal carries an ADR-036 signature. `default-features
# = false` on mudra drops the bip32/bip39 bridge, so the wasm stays lean.
hemera = { package = "cyber-hemera", path = "../../hemera/rs" }
mudra = { package = "cyber-mudra", path = "../../mudra", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Navigator",
    "Clipboard",
    "HtmlInputElement",
    "Storage",
    "File",
    "FileList",
    "Blob",
    "Event",
    "DragEvent",
    "DataTransfer",
] }

[[bin]]
name = "studio"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# studio is its own package: the cybergraph crate at the repository root
# builds without it and without a wasm toolchain.
[workspace]
