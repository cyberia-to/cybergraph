[package]
name = "cybergraph"
version = "0.1.0"
edition = "2024"
description = "signal lifecycle, equivocation detection, and local sync — coordinator layer over BBG"
license = "Cyber"

[dependencies]
bbg    = { path = "../bbg/rs" }
hemera = { package = "cyber-hemera", path = "../hemera/rs" }
nebu   = { package = "cyb-nebu", path = "../strata/nebu/rs" }
zheng  = { path = "../zheng" }

[dev-dependencies]
nox  = { path = "../nox/rs" }
lens = { package = "cyber-lens", path = "../lens/src" }
