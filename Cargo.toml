# ---
# tags: cybergraph, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "cybergraph"
version = "0.1.0"
edition = "2024"
description = "local-first cyberlink processor — unified API over bbg + sync + radio"
license = "Cyber"

[dependencies]
bbg    = { path = "../bbg/rs" }
cyber-sync = { path = "../sync", default-features = false }
hemera = { package = "cyber-hemera", path = "../hemera/rs" }
nebu   = { package = "cyb-nebu", path = "../strata/nebu/rs" }
zheng  = { path = "../zheng" }

# inf query engine — the local query path runs inf IR over a bbg-backed source.
inf-value  = { path = "../inf/rs/value" }
inf-source = { path = "../inf/rs/source" }
inf-parse  = { path = "../inf/rs/parse" }
inf-plan   = { path = "../inf/rs/plan" }
inf-eval   = { path = "../inf/rs/eval" }

[dev-dependencies]
nox  = { path = "../nox/rs" }
lens = { package = "cyber-lens", path = "../lens/src" }
