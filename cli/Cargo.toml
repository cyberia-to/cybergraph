# ---
# tags: cybergraph, cli, config
# crystal-type: source
# crystal-domain: cyber
# ---
[package]
name = "cybergraph-cli"
version = "0.1.0"
edition = "2021"
description = "cybergraph — the cyberlink processor, on the command line"
license = "Cyber"

[[bin]]
name = "cybergraph"
path = "src/main.rs"

[dependencies]
cybergraph = { path = ".." }
foculus = { path = "../../foculus", default-features = false }
inf-value  = { path = "../../inf/rs/value" }
clap       = { version = "4", features = ["derive"] }

# cybergraph/Cargo.toml carries a [workspace] table with no `members`, so cargo
# treats it as the workspace root for anything nested under it. This crate is
# not meant to be a member (it has its own Cargo.lock and pulls cybergraph
# only by path), so it opts out explicitly — otherwise `cargo check`/`cargo
# test` cannot run from this directory at all: "current package believes
# it's in a workspace when it's not".
[workspace]
