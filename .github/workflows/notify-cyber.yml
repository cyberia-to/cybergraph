name: Notify cyber

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cyber rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CYBER_DISPATCH_TOKEN }}
          repository: cyberia-to/cyber
          event-type: content-changed
